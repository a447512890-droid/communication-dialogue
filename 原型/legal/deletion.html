<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号注销协议 · 虚拟电话</title><link rel="stylesheet" href="legal.css"></head><body><header><span>虚拟电话</span><strong>账号注销协议</strong></header><main><h1>账号注销协议</h1><p>继续前请仔细阅读以下内容。</p><p>1. 您将无法再登录该账号。</p><p>2. 账号注销不可逆，数据无法恢复。</p><p>3. 所有信息将根据适用法律法规予以删除。</p><p id="result" role="status"></p></main><footer><button id="continue" disabled>同意并继续 10s</button></footer><script>let remaining=10;const button=document.getElementById("continue");const timer=setInterval(()=>{remaining--;button.textContent=remaining?"同意并继续 "+remaining+"s":"同意并继续";button.disabled=remaining>0;if(!remaining)clearInterval(timer)},1000);button.onclick=()=>{document.getElementById("result").textContent="原型演示：注销接口尚未接入，当前账号未变更。"}</script></body></html>
